[package]
name = "ozzie"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"

[dependencies]
axum = "0.8.9"
dotenvy = "0.15.7"
mongodb = "3.10.1"
poise = "0.7.1"
serde = { version = "1.0.229", features = ["derive"] }
serenity = "0.12.5"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
tower-http = { version = "0.7.1", features = ["fs"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
